name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flet requests pillow

      - name: Build APK
        run: |
          flet pack gui_flet.py --app-name "ACG Photo Get" --package-name "com.acg.photodownloader" --app-version "1.0.0" --output-dir dist

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: acg-photo-get-apk
          path: dist/*.apk