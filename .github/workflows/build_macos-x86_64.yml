name: Build macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv
      - run: uv sync
      - run: uv pip install pyinstaller

      - name: Build app
        run: |
          uv run pyinstaller --windowed \
              --name ACG_Photo_Get \
              gui.py  
              
      - name: Package
        run: |
          cd dist
          zip -r ACG_Photo_Get-macos-x86_64.zip ACG_Photo_Get.app

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
